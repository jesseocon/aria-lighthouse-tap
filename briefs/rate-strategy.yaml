tap: tap-lighthouse
streams: [rate_strategy_base_rates, rate_strategy_discounts, rate_strategy_patterns, rate_strategy_cancellation]
start_url: https://app.mylighthouse.com/hotel/{hotel_id}/strategy
variables:
  hotel_id: "202158"
  compset_id: "1"                             # "App Primary" only (decision 2026-10-29); the page itself asks for 1,2
api:
  # Workshop run 20261029-220956-9401d156, seq 138 (replays 140-142).
  endpoint: GET /apigateway/v1/app/ratestrategy/
  query:
    hotel_id: "{hotel_id}"
    compset_ids: "{compset_id}"
    weeks[]: ["{offset}", ...]                # repeatable; negative week offsets, -1 .. -52
  response:
    records_path: rate_strategies[]          # one entry per snapshot: the current one plus one per requested offset
  snapshot: weekly
  snapshot_week:
    current: "the entry with id '0' / extract_date '1970-01-01' (placeholder) = the current week; set snapshot_week to the Monday of the run week"
    history: "every other entry carries its Monday in extract_date (weeks[]=-1 -> 2026-10-19 on 2026-10-29)"
  backfill: "first run requests weeks[] -1 .. -52 (batch ~8 offsets per request); -52 returned 2025-10-27, -104 returns 400"
  incremental: "later runs request weeks[]=-1 only: the current entry plus last week (Lighthouse may still revise last week)"
  bookmark: snapshot_week; on a gap, request the missing offsets back to the bookmark (52 weeks max)
  shared_primary_keys: [hotel_id, compset_id, snapshot_week, hotelinfo_id]
  merge: per stream, replace all rows of a snapshot_week on reload
labels:
  # rstypes[] and rssubtypes[] arrive in every snapshot; join them in, no separate stream.
  rstypes: [best_flex, semi_flex, non_ref, day_of_week, leadtime, los, mealtype, membership, mobile, pos, roomtype]
  subtype_examples: "day_of_week_1..7 (label = weekday number), leadtime_0/1/3/5/7/14/21/30, los_2/3, mealtype_2..7, membership_bookingdotcom / _expedia / _branddotcom_weekday / _branddotcom_weekend, mobile_bookingdotcom_1/2, mobile_expedia_1/2, pos_bookingdotcom_GB, pos_expedia_GB, roomtype_standard"
hints:
  - "Six hotels per snapshot: the subject (hotelinfo 28650 for hotel 202158) and the 5 App Primary competitors. Names and is_subject come from the hotel context call"
  - "hotelinfo arrives as a string; cast to integer"
  - "Records reference their base rate by rsbaserate id ('baserate_<room name>_<hotelinfo>,0'); keep it as base_rate_ref"
  - "Messages seen: '', 'rates.notoffered' (hotel doesn't use that strategy), 'rates.noncomputable'. Keep the row and the message"
  - "Snapshot sizes on 2026-10-29: base rates 60-72, strategies 120, patterns 130-139, cancellation 12"
streams_spec:
  rate_strategy_base_rates:
    source: rsbaserates[]
    primary_keys: [hotel_id, compset_id, snapshot_week, base_rate_id]
    fields:
      base_rate_id: {from: id, type: string}
      hotelinfo_id: {from: hotelinfo, type: integer}
      hotel_name: string
      is_subject_hotel: boolean
      room_type: {from: roomtype, type: string}
      room_name: {from: roomname, type: string}
      pos: string
      meal_type: {from: mealtype, type: integer}
      is_cancellable: boolean
      is_base: boolean
      is_bar: boolean
      rate: number
      currency: string
      message: string
  rate_strategy_discounts:
    source: rsstrategies[]
    primary_keys: [hotel_id, compset_id, snapshot_week, strategy_id]
    fields:
      strategy_id: {from: id, type: string}
      hotelinfo_id: {from: hotelinfo, type: integer}
      hotel_name: string
      is_subject_hotel: boolean
      rs_type: {from: "rssubtypes[rssubtype].rstype -> rstypes.name", type: string}
      rs_subtype: {from: "rssubtypes[rssubtype].name", type: string}
      rs_subtype_label: {from: "rssubtypes[rssubtype].label", type: string}
      value: number                           # fraction when is_absolute is false (-0.02 = -2%), currency amount when true (18 = +$18)
      is_absolute: boolean
      frequency_weekday: integer
      frequency_weekend: integer
      discounted_price: number
      base_rate_ref: {from: rsbaserate, type: string}
      message: string
  rate_strategy_patterns:
    source: rspatterns[]
    primary_keys: [hotel_id, compset_id, snapshot_week, pattern_id]
    fields:
      pattern_id: {from: id, type: string}
      hotelinfo_id: {from: hotelinfo, type: integer}
      hotel_name: string
      is_subject_hotel: boolean
      rs_type: string                         # day_of_week or leadtime
      rs_subtype: string
      rs_subtype_label: string                # weekday number, or days of lead time
      rate: number
      base_rate_ref: {from: rsbaserate, type: string}
      message: string
  rate_strategy_cancellation:
    source: rscancellationpolicies[]
    primary_keys: [hotel_id, compset_id, snapshot_week, policy_id]
    fields:
      policy_id: {from: id, type: string}
      hotelinfo_id: {from: hotelinfo, type: integer}
      hotel_name: string
      is_subject_hotel: boolean
      rs_subtype: string                      # best_flex or semi_flex
      days_before_arrival: {from: days, type: integer}
      cutoff_time: {from: time, type: string} # 'HH:MM'
      frequency_weekday: integer
      frequency_weekend: integer
      base_rate_ref: {from: rsbaserate, type: string}
      message: string
common_fields:
  hotel_id: {from: request.hotel_id, type: integer}
  compset_id: {from: request.compset_ids, type: integer}
  snapshot_week: date
  extracted_at: timestamp
success:
  min_records: 50
  required_fields: [snapshot_week, hotelinfo_id]
  not_login_page: true
