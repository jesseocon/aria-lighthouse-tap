# Each build reuses the layers of the last image pushed as :latest (BuildKit inline
# cache), so only the layers after the first changed file rebuild.
steps:
  - name: gcr.io/cloud-builders/docker
    env: [DOCKER_BUILDKIT=1]
    args:
      - build
      - --build-arg
      - ARIA_RUNNER_IMAGE=us-central1-docker.pkg.dev/hospitalityops/aria/aria-runner:0.1.28
      - --build-arg
      - BUILDKIT_INLINE_CACHE=1
      - --cache-from
      - us-central1-docker.pkg.dev/hospitalityops/aria/aria-connector-lighthouse:latest
      - -t
      - us-central1-docker.pkg.dev/hospitalityops/aria/aria-connector-lighthouse:0.1.24
      - -t
      - us-central1-docker.pkg.dev/hospitalityops/aria/aria-connector-lighthouse:latest
      - .
images:
  - us-central1-docker.pkg.dev/hospitalityops/aria/aria-connector-lighthouse:0.1.24
  - us-central1-docker.pkg.dev/hospitalityops/aria/aria-connector-lighthouse:latest
options:
  machineType: E2_HIGHCPU_8
timeout: 2400s
