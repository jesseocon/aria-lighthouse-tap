# Property registry for Lighthouse → BigQuery → dbt pipeline.
#
# One Meltano environment per warehouse:
#   development → hospitalityops-dev + development_property_id
#   production  → hospitalityops + production_property_id
# Default sync scrapes Lighthouse once into development, copies bronze to
# production, then runs dbt in both. Pass --environment to limit to one.
#
# Required per property:
#   slug                       CLI key for scripts/sync-property.sh
#   hotel_id                   Lighthouse numeric hotel id
#   production_property_id     Aria property CUID in hospitalityops
#   development_property_id    Aria property CUID in hospitalityops-dev
#   subject_entity_key         Rate-shop pivot key for the subject hotel
#   pivot_parent_group_slug
#   rate_shop_dimensions       Comp-set dimension keys (from _pivot_entity_labels)
#   parity_channel_dimensions  Parity channel keys + labels (from _parity_entity_labels)
#
# Add rows here as you onboard properties (target: 24).

org_id: "1782243883257222643"
bq_project_production: hospitalityops
bq_project_development: hospitalityops-dev
source: mlt_lighthouse_ota

properties:
  - slug: hilton-garden-inn-boston-burlington
    property_slug: hilton-garden-inn-boston-burlington-ma
    hotel_id: "202158"
    production_property_id: cmr9gjpz60001js046zkgomo9
