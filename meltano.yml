send_anonymous_usage_stats: false
project_id: aria-lighthouse-tap
default_environment: development
requires_meltano: '>=4.0'
venv:
  backend: uv

environments:
- name: development
  config:
    plugins:
      extractors:
      - name: tap-lighthouse
        config:
          storage_state_path: storage_state.json
          start_date: '2026-09-15'

        select:
        - strategy-snapshot-v2.*
      loaders:
      - name: target-bigquery
        config:
          project: hospitalityops-dev
          credentials_path: $TARGET_BIGQUERY_CREDENTIALS_PATH
      utilities:
      - name: dbt-bigquery
        config:
          keyfile: $TARGET_BIGQUERY_CREDENTIALS_PATH
          project: hospitalityops-dev
          dataset: silver_1782243883257222643

- name: production
  config:
    plugins:
      extractors:
      - name: tap-lighthouse
        config:
          storage_state_path: storage_state.json
          start_date: '2026-09-15'
        select:
        - strategy-snapshot-v2.*
      loaders:
      - name: target-bigquery
        config:
          project: hospitalityops
          credentials_path: $TARGET_BIGQUERY_CREDENTIALS_PATH
      utilities:
      - name: dbt-bigquery
        config:
          keyfile: $TARGET_BIGQUERY_CREDENTIALS_PATH
          project: hospitalityops
          dataset: silver_1782243883257222643

plugins:
  extractors:
  - name: tap-lighthouse
    namespace: tap_lighthouse
    pip_url: -e ${MELTANO_PROJECT_ROOT}/packages/tap-lighthouse
    capabilities:
    - state
    - catalog
    - discover
    - about
    - stream-maps
    - structured-logging

    settings_group_validation:
    - [hotel_id, username, password]
    - [storage_state_path, hotel_id]

    settings:
    - name: handoff_path
      label: Login chain handoff
      description: Login chain only. Memory-only file for the signed-in browser state between runs.
      kind: string
    - name: storage_state_path
      label: Storage State Path
      description: Path to Playwright storage_state.json. Used when auth_method is storage_state.
      sensitive: true

    - name: auth_method
      kind: string
      value: storage_state
      label: Auth Method
      description: password types the username and password. storage_state replays a saved login.

    - name: login_url
      kind: string
      value: https://app.mylighthouse.com/login
      label: Login URL

    - name: username
      kind: string
      sensitive: true
      label: Username

    - name: password
      kind: string
      sensitive: true
      label: Password

    - name: hotel_id
      kind: string
      label: Hotel ID
      description: Lighthouse property hotel id (numeric)

    - name: base_url
      kind: string
      value: https://app.mylighthouse.com

      label: Base URL
      description: Lighthouse app base URL
    - name: session_probe_url
      kind: string
      value: https://app.mylighthouse.com/

      label: Session Probe URL
      description: URL used to verify an authenticated session
    - name: headless
      kind: boolean
      value: true

      label: Headless Browser
      description: Run Chromium headless (set false for debugging)
    - name: rate_limit_seconds
      kind: integer
      value: 5

      label: Rate Limit Seconds
      description: Minimum seconds between page actions / exports
    - name: start_date
      kind: date_iso8601
      label: Start Date
      description: Earliest as_of_date for strategy-snapshot on first sync

    - name: end_date
      kind: date_iso8601
      label: End Date
      description: Latest as_of_date for strategy-snapshot (defaults to today)

    - name: window_days
      kind: integer
      value: 365

      label: Snapshot Window Days
      description: Sliding window length for strategy-snapshot exports
    - name: lookback_days
      kind: integer
      value: 7

      label: Lookback Days
      description: Days to re-sync on incremental runs (lookback mode)

    - name: parity_los
      kind: integer
      value: 1

      label: Parity Length of Stay
    - name: parity_max_persons
      kind: integer
      value: 2

      label: Parity Max Persons
    - name: parity_forward_months
      kind: integer
      value: 2

      label: Parity Forward Months
      description: Months after the current month to scrape (current + next + next+1)
    - name: parity_hover_delay_ms
      kind: integer
      value: 300

      label: Parity Hover Delay Ms
    - name: rates_forward_months
      kind: integer
      value: 1

      label: Rates Forward Months
      description: Months after the current month to scrape for rates. Default 1.
    - name: rates_rate_types
      kind: string
      value: best_flex

      label: Rates Rate Types
      description: >-
        Comma-separated rate types. Default best_flex.
        Also lowest_flex, lowest, third_party.
    - name: rates_refresh
      kind: boolean
      value: true

      label: Rates Refresh
      description: >-
        Click Refresh rates once per channel page. Skip the click when the
        Updated label is already within rates_refresh_recent_seconds.
    - name: rates_refresh_timeout_seconds
      kind: integer
      value: 1200

      label: Rates Refresh Timeout Seconds
      description: Poll the Updated label this long after one click. Do not click again.
    - name: rates_refresh_poll_seconds
      kind: integer
      value: 15

      label: Rates Refresh Poll Seconds
      description: Seconds between Updated-label reads.
    - name: rates_refresh_recent_seconds
      kind: integer
      value: 600

      label: Rates Refresh Recent Seconds
      description: >-
        A label this recent skips another click and counts as refresh finished.
    - name: budget_variance
      kind: string
      value: absolute

      label: Budget Variance Mode
    - name: budget_start_month
      kind: string
      label: Budget Start Month
      description: First YYYY-MM month to sync (e.g. 2020-01). Defaults to current month.

    - name: budget_forward_months
      kind: integer
      value: 2

      label: Budget Forward Months
      description: Months after the current month to scrape on every sync
    - name: forecast_start_month
      kind: string
      label: Forecast Start Month
      description: First YYYY-MM month to sync (e.g. 2020-01). Defaults to current month.

    - name: forecast_forward_months
      kind: integer
      value: 2

      label: Forecast Forward Months
      description: Months after the current month to scrape on every sync
    - name: api_pause_min_seconds
      kind: integer
      value: 4
      label: API Pause Min Seconds
      description: v2 streams. Shortest random pause between API batches.
    - name: api_pause_max_seconds
      kind: integer
      value: 9
      label: API Pause Max Seconds
      description: v2 streams. Longest random pause between API batches.
    - name: strategy_v2_pickup_days
      kind: integer
      value: 7
      label: Strategy v2 Pickup Days
      description: strategy-snapshot-v2. Pickup and variance compare date is as-of minus this many days.
    - name: strategy_v2_max_as_of_dates
      kind: integer
      value: 0
      label: Strategy v2 Max As-of Dates
      description: strategy-snapshot-v2. Cap as-of dates per run for backfills (0 = no cap).
    - name: rates_v2_refresh
      kind: boolean
      value: false
      label: Rates v2 Refresh
      description: rates-v2. Click Refresh rates (live shop) once per month and channel before the API calls.
    - name: events_days_back
      kind: integer
      value: 365
      label: Events Days Back
      description: events, holidays. Days before today to read on every sync.
    - name: events_days_forward
      kind: integer
      value: 365
      label: Events Days Forward
      description: events, holidays. Days after today to read on every sync.
    - name: demand_days_forward
      kind: integer
      value: 90
      label: Demand Days Forward
      description: demand. Days after today to request (Lighthouse fills about 60).
    - name: smart_insights_rate_type
      kind: string
      value: lowest
      label: Smart Insights Rate Type
      description: smart-insights. Rate type the KPIs compare (page default lowest).
    - name: smart_insights_ota
      kind: string
      value: bookingdotcom
      label: Smart Insights OTA
      description: smart-insights. OTA the rate KPIs come from (page default bookingdotcom).
    - name: ranking_otas
      kind: string
      value: bookingdotcom,expedia
      label: Ranking OTAs
      description: ota-ranking-daily. Comma-separated OTAs read per stay date.
    - name: rate_strategy_backfill_weeks
      kind: integer
      value: 52
      label: Rate Strategy Backfill Weeks
      description: rate-strategy-*. Weeks of history to load on the first sync (Lighthouse keeps 52).
    - name: rate_strategy_weeks_per_request
      kind: integer
      value: 8
      label: Rate Strategy Weeks Per Request
      description: rate-strategy-*. Week offsets per API call during a backfill.

    config:
      storage_state_path: storage_state.json
      hotel_id: '202158'
      start_date: '2026-09-15'
      parity_forward_months: 2
      rates_rate_types: best_flex
      rates_forward_months: 1
      rates_refresh: true
      rates_refresh_timeout_seconds: 1200
      rates_refresh_poll_seconds: 15
      rates_refresh_recent_seconds: 600
      budget_variance: absolute
      budget_forward_months: 2
      forecast_forward_months: 2

    select:
    - strategy-snapshot-v2.*

    metadata:
      tap-lighthouse:
        strategy-snapshot-v2:
          replication-method: INCREMENTAL
          replication-key: as_of_date
        market-segments:
          replication-method: INCREMENTAL
          replication-key: as_of_date
        rate-plans:
          replication-method: INCREMENTAL
          replication-key: as_of_date
        length-of-stay:
          replication-method: INCREMENTAL
          replication-key: as_of_date
        room-type:
          replication-method: INCREMENTAL
          replication-key: as_of_date
        parity-list-v2:
          replication-method: INCREMENTAL
          replication-key: run_timestamp
        rates-v2:
          replication-method: INCREMENTAL
          replication-key: run_timestamp
        events:
          replication-method: FULL_TABLE
        holidays:
          replication-method: FULL_TABLE
        demand:
          replication-method: INCREMENTAL
          replication-key: as_of_date
        smart-insights:
          replication-method: INCREMENTAL
          replication-key: as_of_date
        ota-ranking-summary:
          replication-method: FULL_TABLE
        ota-ranking-daily:
          replication-method: INCREMENTAL
          replication-key: as_of_date
        rate-strategy-base-rates:
          replication-method: INCREMENTAL
          replication-key: snapshot_week
        rate-strategy-discounts:
          replication-method: INCREMENTAL
          replication-key: snapshot_week
        rate-strategy-patterns:
          replication-method: INCREMENTAL
          replication-key: snapshot_week
        rate-strategy-cancellation:
          replication-method: INCREMENTAL
          replication-key: snapshot_week

  loaders:
  - name: target-bigquery
    variant: z3z1ma
    pip_url: git+https://github.com/z3z1ma/target-bigquery.git
    config:
      project: hospitalityops-dev
      dataset: bronze_1782243883257222643
      location: US
      method: batch_job
      batch_size: 10000
      upsert: true
      dedupe_before_upsert: true
      add_record_metadata: true
      cluster_on_key_properties: true
      denormalized: true
      schema_resolver_version: 2

  utilities:
  - name: dbt-bigquery
    variant: dbt-labs
    pip_url: dbt-core dbt-bigquery meltano-dbt-ext~=0.5.0
    commands:
      run-operation:
        args: run-operation
        description: Invoke a dbt macro (used to copy bronze into production).
    config:
      project: hospitalityops-dev
      dataset: silver_1782243883257222643
      auth_method: service-account
      project_dir: $MELTANO_PROJECT_ROOT/transform
      profiles_dir: $MELTANO_PROJECT_ROOT/transform/profiles/bigquery

jobs:
- name: lighthouse-scrape-bigquery
  tasks:
  - tap-lighthouse target-bigquery

- name: lighthouse-transform
  tasks:
  - dbt-bigquery:run

- name: lighthouse-development-bigquery
  tasks:
  - tap-lighthouse target-bigquery dbt-bigquery:run

version: 1
