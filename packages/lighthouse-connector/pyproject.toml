[project]
name = "lighthouse-connector"
version = "0.1.0"
description = "aria-runner connector: Lighthouse scrape, bronze copy, and dbt per property"
requires-python = ">=3.11"
dependencies = [
    "aria-runner",
    "pyyaml>=6",
    "singer-playwright",
]

[project.entry-points."aria_runner.connectors"]
lighthouse = "lighthouse_connector:connector"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lighthouse_connector"]
