
            query GetLhDayByDayRoomTypes(
                $hotelId: ID!,
                $filters: LhDayByDayFilters!,
                $currency: String,
                $currencyVariant: String!
            ) {
                lhDayByDayRoomTypes(
                    hotelId: $hotelId,
                    filters: $filters,
                    currency: $currency,
                    currencyVariant: $currencyVariant
                ) {
                    aggregates { ...segmentAggregateMapFields }
                    mappings {
                        id
                        category {
                            id
                            name
                        }
                        inventory
                        roomType
                    }
                    topCategories
                }
            }
            
    fragment segmentAggregateMapFields on LhDayByDaySegmentAggregateMap {
        aggregates {
            asofRevenue
            asofRooms
            company
            groupName
            lengthOfStay
            marketSegment
            otbRevenue
            otbRooms
            ratePlan
            reservationId
            roomType
            stlyRevenue
            stlyRooms
            stayDate
            varianceRevenue
            varianceRooms
            weekday
        }
        stayDate
    }
    