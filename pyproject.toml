[project]
name = "aria-lighthouse-tap"
version = "0.1.0"
description = "Meltano project for Lighthouse (OTA Insight) via Playwright tap."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "singer-playwright",
    "tap-lighthouse",
    "meltano>=4.0",
]

[tool.uv.workspace]
members = [
    "packages/tap-lighthouse",
]

[tool.uv.sources]
singer-playwright = { path = "../aria-singer-playwright", editable = true }
tap-lighthouse = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9",
    "pyyaml>=6",
    "singer-sdk[testing]",
]

[tool.pytest.ini_options]
addopts = ["-ra"]
testpaths = ["packages/tap-lighthouse/tests", "tests"]
log_level = "INFO"
minversion = "9"
