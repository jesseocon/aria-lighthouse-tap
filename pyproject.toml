[project]
name = "aria-lighthouse-tap"
version = "0.1.0"
description = "Meltano project for Lighthouse (OTA Insight) via Playwright tap."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aria-runner[browser]",
    "lighthouse-connector",
    "singer-playwright",
    "tap-lighthouse",
    "meltano>=4.0",
]

[tool.uv.workspace]
members = [
    "packages/lighthouse-connector",
    "packages/tap-lighthouse",
]

[tool.uv.sources]
singer-playwright = { git = "https://github.com/jesseocon/aria-singer-playwright.git", rev = "v0.2.0" }
tap-lighthouse = { workspace = true }
lighthouse-connector = { workspace = true }
aria-runner = { path = "../aria-runner" }

[dependency-groups]
dev = [
    "pytest>=9",
    "pyyaml>=6",
    "singer-sdk[testing]",
]

[tool.pytest.ini_options]
addopts = ["-ra"]
testpaths = ["packages/tap-lighthouse/tests", "packages/lighthouse-connector/tests", "tests"]
log_level = "INFO"
minversion = "9"
