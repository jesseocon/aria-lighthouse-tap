[project]
name = "aria-lighthouse-meltano"
version = "0.1.0"
description = "Meltano monorepo for Playwright-backed Singer taps (Lighthouse, ProfitSword, …)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "singer-playwright",
    "tap-lighthouse",
]

[tool.uv.workspace]
members = [
    "packages/singer-playwright",
    "packages/tap-lighthouse",
]

[tool.uv.sources]
singer-playwright = { workspace = true }
tap-lighthouse = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9",
    "pyyaml>=6",
    "singer-sdk[testing]",
]

[tool.pytest]
addopts = ["-ra"]
testpaths = ["packages/singer-playwright/tests", "packages/tap-lighthouse/tests", "tests"]
log_level = "INFO"
minversion = "9"
