version: 2

models:
  - name: mlt_mart__commercial__otb_daily
    description: Wide day-by-day grid with nested rate_shop array (Meltano pipeline).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - property_id
              - as_of_date
              - stay_date
    columns:
      - name: property_id
        tests: [not_null]
      - name: as_of_date
        tests: [not_null]
      - name: stay_date
        tests: [not_null]
      - name: rate_shop
        description: Nested comp-set rates for UI rendering.

  - name: mlt_mart__commercial__rate_shop_daily
    description: Long rate-shop fact for trend charts.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - property_id
              - as_of_date
              - stay_date
              - entity_key
    columns:
      - name: property_id
        tests: [not_null]
      - name: entity_key
        tests: [not_null]
      - name: entity_role
        tests:
          - accepted_values:
              arguments:
                values: ['subject', 'comp_avg', 'comp']

  - name: mlt_mart__commercial__parity_daily
    description: Wide parity-list mart (pass-through from silver).
    columns:
      - name: property_id
        tests: [not_null]
      - name: record_hash
        tests: [not_null]
      - name: run_timestamp
        tests: [not_null]
      - name: stay_date
        tests: [not_null]

  - name: mlt_mart__commercial__parity_loss_daily
    description: Exploded metasearch loss channels with FK to parity-list rows.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - metasearch_loss_id
    columns:
      - name: property_id
        tests: [not_null]
      - name: record_hash
        tests: [not_null]
      - name: channel
        tests: [not_null]

  - name: mlt_mart__commercial__budget_daily
    description: Wide budget mart with expanded date/category/segment hierarchy rows.
    columns:
      - name: property_id
        tests: [not_null]
      - name: record_hash
        tests: [not_null]
      - name: run_timestamp
        tests: [not_null]
      - name: stay_date
        tests: [not_null]
      - name: row_key
        tests: [not_null]
      - name: row_level
        tests: [not_null]

  - name: mlt_mart__commercial__forecast_daily
    description: Wide forecast mart with expanded date/category/segment hierarchy rows.
    columns:
      - name: property_id
        tests: [not_null]
      - name: record_hash
        tests: [not_null]
      - name: run_timestamp
        tests: [not_null]
      - name: stay_date
        tests: [not_null]
      - name: row_key
        tests: [not_null]
      - name: row_level
        tests: [not_null]

  - name: mlt_mart__commercial__market_calendar_daily
    description: >-
      One row per stay date. Latest demand index (and its 7-day change), events and
      holidays touching the night, and the latest Smart Insights KPIs. PMS KPIs
      (occupancy, room nights, ADR) are null for hotels without a PMS connection.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [property_id, stay_date]
    columns:
      - name: property_id
        tests: [not_null]
      - name: stay_date
        tests: [not_null]
      - name: events
        description: Events on this night, most important first (cancelled ones flagged, not counted).

  - name: mlt_mart__commercial__ota_reputation_weekly
    description: >-
      Subject vs comp set per OTA and ISO week: OTA ranking with the number of hotels it
      ranks among, review score against the comp set's average and best, and the
      subject's place by review score. review_scale is 10 or 5.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [property_id, period, ota]
    columns:
      - name: property_id
        tests: [not_null]
      - name: period
        tests: [not_null]
      - name: ota
        tests: [not_null]

  - name: mlt_mart__commercial__ota_reputation_monthly
    description: >-
      Subject vs comp set per OTA and month: OTA ranking with the number of hotels it
      ranks among, review score against the comp set's average and best, and the
      subject's place by review score. review_scale is 10 or 5.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [property_id, period, ota]
    columns:
      - name: property_id
        tests: [not_null]
      - name: period
        tests: [not_null]
      - name: ota
        tests: [not_null]

  - name: mlt_mart__commercial__ota_ranking_daily
    description: >-
      Subject's OTA search rank per stay date on each capture day, with the comp set's
      best rank and the subject's price against the comp-set median.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [property_id, as_of_date, stay_date, ota]
    columns:
      - name: property_id
        tests: [not_null]
      - name: as_of_date
        tests: [not_null]
      - name: stay_date
        tests: [not_null]

  - name: mlt_mart__commercial__rate_strategy_weekly
    description: >-
      Per week and rate strategy: whether the subject offers it and how deeply, against
      how many competitors offer it and their median. value is a fraction of the base
      rate unless is_absolute.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [property_id, snapshot_week, rs_subtype]
    columns:
      - name: property_id
        tests: [not_null]
      - name: snapshot_week
        tests: [not_null]
      - name: rs_subtype
        tests: [not_null]
