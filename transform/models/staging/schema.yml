version: 2

models:
  - name: stg_mlt_lighthouse_ota__snapshot_daily
    description: Typed daily strategy snapshot from Meltano bronze wide export.
    columns:
      - name: property_id
        tests: [not_null]
      - name: as_of_date
        tests: [not_null]
      - name: stay_date
        tests: [not_null]

  - name: stg_mlt_lighthouse_ota__snapshot_comp_set
    description: Long comp-set rates unpivoted from wide Meltano bronze export.
    columns:
      - name: property_id
        tests: [not_null]
      - name: dimension
        tests: [not_null]

  - name: stg_mlt_lighthouse_ota__snapshot_daily_v2
    description: Latest Spider strategy row per as-of date and stay date.
    columns:
      - name: property_id
        tests: [not_null]
      - name: as_of_date
        tests: [not_null]
      - name: stay_date
        tests: [not_null]

  - name: stg_mlt_lighthouse_ota__market_segments
    description: Latest market-segment row per as-of date, stay date, and segment.
    columns:
      - name: property_id
        tests: [not_null]
      - name: as_of_date
        tests: [not_null]
      - name: stay_date
        tests: [not_null]
      - name: market_segment
        tests: [not_null]

  - name: stg_mlt_lighthouse_ota__rate_plans
    description: Latest rate-plan row per as-of date, stay date, segment, and rate plan.
    columns:
      - name: property_id
        tests: [not_null]
      - name: as_of_date
        tests: [not_null]
      - name: stay_date
        tests: [not_null]
      - name: market_segment
        tests: [not_null]
      - name: rate_plan
        tests: [not_null]

  - name: stg_mlt_lighthouse_ota__length_of_stay
    description: Latest length-of-stay row per as-of date, stay date, and length of stay.
    columns:
      - name: property_id
        tests: [not_null]
      - name: as_of_date
        tests: [not_null]
      - name: stay_date
        tests: [not_null]
      - name: length_of_stay
        tests: [not_null]

  - name: stg_mlt_lighthouse_ota__room_type
    description: Latest room-type row per as-of date, stay date, and room type.
    columns:
      - name: property_id
        tests: [not_null]
      - name: as_of_date
        tests: [not_null]
      - name: stay_date
        tests: [not_null]
      - name: room_type
        tests: [not_null]

  - name: stg_mlt_lighthouse_ota__parity_list
    description: Latest parity API row per record hash.
    columns:
      - name: property_id
        tests: [not_null]
      - name: record_hash
        tests: [not_null]
      - name: run_timestamp
        tests: [not_null]
      - name: stay_date
        tests: [not_null]

  - name: stg_mlt_lighthouse_ota__parity_metasearch_loss
    description: Metasearch loss channels exploded from parity-list hover JSON.
    columns:
      - name: property_id
        tests: [not_null]
      - name: record_hash
        tests: [not_null]
      - name: metasearch_loss_id
        tests: [not_null]

  - name: stg_mlt_lighthouse_ota__budget
    description: >-
      Wide budget rows with typed run_timestamp, stay_date, and hierarchy join keys
      (row_key, parent_row_key, date_row_key, category_row_key).
    columns:
      - name: property_id
        tests: [not_null]
      - name: record_hash
        tests: [not_null]
      - name: run_timestamp
        tests: [not_null]
      - name: stay_date
        tests: [not_null]
      - name: row_level
        description: "0=date total, 1=category, 2=segment."
      - name: row_key
        description: Stable row identity within a run; join target for parent_row_key.
      - name: parent_row_key
        description: Parent row_key within the same run_id (null for date totals).

  - name: stg_mlt_lighthouse_ota__forecast
    description: >-
      Wide forecast rows with typed run_timestamp, stay_date, and hierarchy join keys
      (row_key, parent_row_key, date_row_key, category_row_key).
    columns:
      - name: property_id
        tests: [not_null]
      - name: record_hash
        tests: [not_null]
      - name: run_timestamp
        tests: [not_null]
      - name: stay_date
        tests: [not_null]
      - name: row_level
        description: "0=date total, 1=category, 2=segment."
      - name: row_key
        description: Stable row identity within a run; join target for parent_row_key.
      - name: parent_row_key
        description: Parent row_key within the same run_id (null for date totals).

  - name: stg_mlt_lighthouse_ota__rates
    description: >-
      Latest rates API row per record hash. hotel_id is the Lighthouse hotel.
      property_id is the Aria property for this environment.
    columns:
      - name: property_id
        tests: [not_null]
      - name: hotel_id
        tests: [not_null]
      - name: record_hash
        tests: [not_null]
      - name: stay_date
        tests: [not_null]

  - name: stg_mlt_lighthouse_ota__rates_wide
    description: >-
      One snapshot row per stay date, channel, rate type, and refreshed_at.
      Competitor hotels are columns pivoted from the long rates table.
      competitor_names maps each column key to the scraped header.
    columns:
      - name: property_id
        tests: [not_null]
      - name: hotel_id
        tests: [not_null]
      - name: refreshed_at
        description: Approximate time the channel refresh finished.
        tests: [not_null]
      - name: stay_date
        tests: [not_null]
      - name: channel_key
        tests: [not_null]
      - name: rate_type_key
        tests: [not_null]
      - name: competitor_names
        tests: [not_null]
